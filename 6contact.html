<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>
  <header id="main-header">
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="2catalog.html">Catalog</a></li>
        <li><a href="3product.html">Book Details</a></li>
        <li><a href="4about.html">About Us</a></li>
        <li><a href="5prices.html">Pricing</a></li>
        <li><a href="6contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <section class="contact-phones">
      <h3>Phone Numbers</h3>
      <ul>
        <li><strong>Main Office:</strong> +1 (123) 456-7890</li>
        <li><strong>Customer Support:</strong> +1 (123) 456-7891</li>
        <li><strong>Book Orders:</strong> +1 (123) 456-7892</li>
      </ul>
    </section>

    <img src="imgs/contactlogo.jpg" alt="Contact Support Representative" class="page-img">

    <h2>Send Us a Message</h2>
    <form id="contact-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="Your email address" required>

      <label for="genre">Favorite Genre:</label>
      <select id="genre" name="genre">
        <option value="classics">Classics</option>
        <option value="fantasy">Fantasy</option>
        <option value="sci-fi">Science Fiction</option>
      </select>

      <label for="theme-color">Preferred Theme Accent Color:</label>
      <input type="color" id="theme-color" name="theme-color" value="#2c3e50">

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" placeholder="Write your message here..."></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>Team Members:</p>
    <ul>
      <li>Altyn Abdinurova</li>
    </ul>
  </footer>
</body>
</html>
